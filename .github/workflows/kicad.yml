name: KiCad

on:
  push:
    branches:
      - main
    paths:
      - "hardware/**"
      - ".github/workflows/kicad.yml"
  pull_request:
    paths:
      - "hardware/**"
      - ".github/workflows/kicad.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kicad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export PDFs and fabrication files
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Schematic PDF
        run: |
          mkdir -p out
          kicad-cli sch export pdf -o out/SDW-schematic.pdf hardware/SDW.kicad_sch

      - name: PCB PDFs
        run: |
          kicad-cli pcb export pdf --mode-single --layers "F.Cu,F.Silkscreen,Edge.Cuts" --scale 0 --include-border-title -o out/SDW-pcb-top.pdf hardware/SDW.kicad_pcb
          kicad-cli pcb export pdf --mode-single --layers "F.Cu,B.Cu,F.Silkscreen,B.Silkscreen,Edge.Cuts" --scale 0 --include-border-title --black-and-white -o out/SDW-pcb-fab.pdf hardware/SDW.kicad_pcb

      - name: Fabrication files
        run: |
          mkdir -p out/gerbers
          kicad-cli pcb export gerbers -o out/gerbers/ --layers "F.Cu,B.Cu,F.Silkscreen,B.Silkscreen,F.Mask,B.Mask,Edge.Cuts" hardware/SDW.kicad_pcb
          kicad-cli pcb export drill -o out/gerbers/ hardware/SDW.kicad_pcb
          kicad-cli sch export bom -o out/SDW-bom.csv hardware/SDW.kicad_sch

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: kicad-outputs
          path: out/
          if-no-files-found: error

  publish:
    name: Publish PDFs
    needs: export
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download outputs
        uses: actions/download-artifact@v4
        with:
          name: kicad-outputs
          path: out

      - name: Commit PDFs
        run: |
          mkdir -p docs
          cp out/*.pdf docs/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update generated PDFs [skip ci]"
          git push
